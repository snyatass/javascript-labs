<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" role="img" aria-labelledby="title desc">
  <title id="title">V8 flame chart before and after optimization</title>
  <desc id="desc">Flame chart sketch showing collision and allocation hotspots before pooling and spatial hashing.</desc>
  <rect width="900" height="280" fill="#0b0e14"/>
  <text x="20" y="30" fill="#e2e8f0" font-family="monospace" font-size="18">Frame flame chart</text>
  <g font-family="monospace" font-size="12">
    <rect x="20" y="55" width="400" height="42" fill="#ff6b81"/><text x="30" y="80" fill="#fff">before: circleCollision O(n²)</text>
    <rect x="420" y="55" width="170" height="42" fill="#ffe66d"/><text x="430" y="80" fill="#111">new Vector2</text>
    <rect x="590" y="55" width="290" height="42" fill="#4cc9f0"/><text x="600" y="80" fill="#111">render</text>
    <rect x="20" y="145" width="220" height="42" fill="#62e6a7"/><text x="30" y="170" fill="#111">after: spatial hash</text>
    <rect x="240" y="145" width="130" height="42" fill="#62e6a7"/><text x="250" y="170" fill="#111">bullet pool</text>
    <rect x="370" y="145" width="510" height="42" fill="#4cc9f0"/><text x="380" y="170" fill="#111">render / RAF</text>
  </g>
  <text x="20" y="245" fill="#94a3b8" font-family="monospace" font-size="13">The optimized frame has no allocation-heavy Vector2 hotspot in the fixed-step network sim.</text>
</svg>
