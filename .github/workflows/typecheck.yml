name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start servers
        run: |
          npm run dev:server &
          npm run dev &
          npx wait-on http://127.0.0.1:3000/health http://127.0.0.1:5173
      - run: npm run test:e2e
